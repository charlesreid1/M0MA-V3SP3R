name: mcp-python
on:
  push:
    paths:
      - "mcp-server/**"
      - "docs/**"
      - "app/src/main/assets/skills/**"
      - ".github/workflows/mcp-python.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - "docs/**"
      - "app/src/main/assets/skills/**"
      - ".github/workflows/mcp-python.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Verify skills sync
        run: python scripts/sync_skills.py --check
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
